<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>
<body>

  <div class="container">
    <h2>Form Fill Exercise</h2>
    
    <div class="timer-box">
      Timer starts if data is found. <br>
      Data clears in: <span id="timerDisplay">60</span>s 
    </div>

    <!-- FORM -->

    <form id="userForm">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" placeholder="Enter first name">
        <p id="firstNameError" class="error-message"></p>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" placeholder="Enter last name">
        <p id="lastNameError" class="error-message"></p>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender">
          <option value="" disabled selected hidden>Select gender...</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
        <p id="genderError" class="error-message"></p>
      </div>

      <button type="submit" id="saveBtn" disabled>Save</button>
    </form>

    <!-- TABLE AREA -->

    <div class="table-container">
      <h3>Saved Users</h3>
      <input type="text"  id="searchInput"  placeholder="Search by first or last name...">

      <div class="table-controls">
        <p id="userCount">Total Users: 0</p>
        <button type="button" id="clearAllBtn" class="clear-all-btn">Clear All</button>
      </div>

      <table id="userTable">
        <thead>
          <tr>
            <th>ID</th>
            <th data-sort="firstName">First Name <span class="sort-arrow"></span></th>
            <th data-sort="lastName">Last Name <span class="sort-arrow"></span></th>
            <th data-sort="gender">Gender <span class="sort-arrow"></span></th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Table adds rows here -->
        </tbody>
      </table>
      <p id="emptyMsg" class="empty-msg">No users added yet.</p>
    </div>
  </div>

</body>
</html>
